<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Δημοτικό Δίκτυο Σήμανσης</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #050505; font-family: 'Arial Narrow', sans-serif; font-weight: bold; letter-spacing: 0.2px; }
        #window-viewport { position: relative; width: 100%; height: 100%; overflow: hidden; }
        .myscreen { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; top: 100%; left: 0; transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1); overflow: hidden; }
        .myscreen.active { transform: translateY(-100%); }
        .myscreen.exit { transform: translateY(-200%); }
        .meta-header { width: 100%; height: 19vh; display: flex; border-bottom: 2px solid rgba(255,255,255,0.08); flex-shrink: 0; }
        .col-left { width: 75%; height: 100%; padding: 8px 8px 8px 32px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; }
        .logo-box { width: 100px; height: 100px; margin-bottom: 25px; flex-shrink: 0; display: flex; align-items: center; justify-content: flex-start; }
        .logo-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .text-cluster { display: flex; flex-direction: column; justify-content: center; overflow: hidden; width: 100%; }
        .left-row { font-size: 1.8rem; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .col-right { width: 25%; height: 100%; padding: 10px 15px; display: flex; flex-direction: column; justify-content: center; line-height: 1.25; text-align: left; overflow: hidden; }
        .right-row { font-size: 1.8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* 2. Unified Progress Container */
        .countdown-container { width: 100%; height: 16px; background: rgba(255,255,255,0.1); flex-shrink: 0; }
        .countdown-bar { height: 100%; width: 100%; background: #ffcc00; transform-origin: left; transform: scaleX(0); }

        /* Hardware accelerated CSS Keyframe loop runs for exactly 15 seconds */
        .myscreen.active .countdown-bar { animation: fillProgress 15s linear forwards; }
        @keyframes fillProgress {
            0% { transform: scaleX(0); }
            100% { transform: scaleX(1); }
        }

        .poster-window { width: 100%; height: calc(81vh - 16px); overflow: hidden; background: #050505; flex-grow: 1; }
        .poster-img { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body>
    <div id="window-viewport"></div>
    <script>
        const INTERVAL_TIME = 15000;
        let currentIndex = 0;
        let rotationTimer;

        const darkBackgrounds = ['#0a0b0d', '#111214', '#050505', '#161719', '#0d0e10'];
        const redBackgrounds = ['#e52d2d', '#f03e3e', '#cc2424', '#ff4d4d', '#dd3333'];
        const textColors = ['#ffffff', '#fcfaf2', '#f0f0f0', '#faebd7', '#f5f5f5'];

        let events = [];

        async function loadLiveEvents() {
            try {
                const response = await fetch('events.json?t=' + new Date().getTime());
                const allFetchedEvents = await response.json();

                const today = new Date();
                today.setHours(0,0,0,0);

                events = allFetchedEvents.filter(event => {
                    const eventDate = new Date(event.date + "T00:00:00");
                    const isUpcoming = eventDate >= today;
                    const isForThisScreen = !screenTarget || event.screen === "all" || event.screen === screenTarget;
                    return isUpcoming && isForThisScreen;
                });

                if (events.length > 0) {
                    preloadPosterAssets(events, () => {
                        buildWholeScreens();
                        if (!rotationTimer) {
                            rotationTimer = setTimeout(slideNextScreen, INTERVAL_TIME);
                        }
                    });
                } else {
                    showSystemPlaceholder("Δεν υπάρχουν προγραμματισμένες εκδηλώσεις");
                }
            } catch (error) {
                showSystemPlaceholder("Σφάλμα σύνδεσης δικτύου");
            }
        }
        function showSystemPlaceholder(msg) {
            document.getElementById('window-viewport').innerHTML = `
                <div class="myscreen active" style="justify-content:center; align-items:center; background:#0d0e10; height:100%; display:flex; flex-direction:column;">
                    <div style="font-size:3rem; margin-bottom:15px;">🏛️</div>
                    <div style="font-size:1.8rem; color:#ffcc00; font-family:sans-serif; text-align:center; padding:20px;">${msg}</div>
                </div>`;
        }
        function preloadPosterAssets(eventList, callback) {
            let loadedCount = 0;
            const totalImages = eventList.length;
            eventList.forEach(event => {
                const imgCache = new Image();
                imgCache.src = event.image;
                imgCache.onload = imgCache.onerror = () => {
                    loadedCount++;
                    if (loadedCount === totalImages) callback();
                };
            });
        }

        function buildWholeScreens() {
            const viewport = document.getElementById('window-viewport');
            viewport.innerHTML = '';

            events.forEach((event, index) => {
                const dateObj = new Date(event.date + "T00:00:00");
                const yearStr = dateObj.toLocaleDateString('el-GR', { year: 'numeric' });
                const monthStr = dateObj.toLocaleDateString('el-GR', { month: 'long' });
                const dayStr = dateObj.toLocaleDateString('el-GR', { day: 'numeric' });
                const weekdayStr = dateObj.toLocaleDateString('el-GR', { weekday: 'long' });

                const bgDark = darkBackgrounds[index % darkBackgrounds.length];
                const bgRed = redBackgrounds[index % redBackgrounds.length];
                const textColor = textColors[index % textColors.length];

                const hasWarning = event.entry && event.entry.trim() !== "";
                const warningStyle = hasWarning ? "display:block; color:#ffcc00;" : "display:none;";

                const screenBlock = document.createElement('div');
                screenBlock.classList.add('myscreen');
                if (index === currentIndex) screenBlock.classList.add('active');

                screenBlock.innerHTML = `
                    <div class="meta-header">
                        <div class="col-left" style="background-color: ${bgDark}; color: ${textColor};">
                            <div class="logo-box"><img src="logo.png" alt="Logo"></div>
                            <div class="text-cluster">
                                <div class="left-row" style="color: #ffcc00;">${event.title}</div>
                                <div class="left-row" style="opacity: 0.9; margin-top: 1px;">${event.maker}</div>
                                <div class="left-row" style="opacity: 0.75; margin-top: 1px;">${event.location}</div>
                            </div>
                        </div>
                        <div class="col-right" style="background-color: ${bgRed}; color: ${textColor};">
                            <div class="right-row">${yearStr}</div>
                            <div class="right-row">${dayStr} ${monthStr}</div>
                            <div class="right-row">${weekdayStr}</div>
                            <div class="right-row">ώρα ${event.time}</div>
                            <div class="right-row" style="${warningStyle}">${event.entry}</div>
                        </div>
                    </div>
                    <div class="countdown-container"><div class="countdown-bar"></div></div>
                    <div class="poster-window">
                        <img class="poster-img" src="${event.image}" alt="Poster" onerror="this.style.display='none';">
                    </div>
                `;
                viewport.appendChild(screenBlock);
            });
        }

        function slideNextScreen() {
            const screens = document.querySelectorAll('.myscreen');
            if (screens.length <= 1) return;

            const prevIndex = currentIndex;
            currentIndex = (currentIndex + 1) % events.length;

            screens.forEach(s => s.classList.remove('exit'));

            if (screens[prevIndex]) {
                screens[prevIndex].classList.remove('active');
                screens[prevIndex].classList.add('exit');
            }
            if (screens[currentIndex]) {
                screens[currentIndex].classList.add('active');
            }

            clearTimeout(rotationTimer);
            rotationTimer = setTimeout(slideNextScreen, INTERVAL_TIME);
        }

        window.onload = loadLiveEvents;
    </script>
</body>
</html>
